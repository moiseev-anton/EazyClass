# TableParser package is installed during the ordinary Compose build.
x-tableparser-environment: &tableparser-environment
  TABLEPARSER_RESOURCE_ROOT: /opt/tableparser-release/runtime
  TABLEPARSER_CATALOG_SOURCE: ${TABLEPARSER_CATALOG_SOURCE:?Set the original catalog namespace}
  TABLEPARSER_PUBLIC_BASE_URL: ${TABLEPARSER_PUBLIC_BASE_URL:?Set the public EazyClass URL}

x-tableparser-mount: &tableparser-mount
  type: bind
  source: ${TABLEPARSER_RELEASE_DIR:?Set the absolute release directory}
  target: /opt/tableparser-release
  read_only: true
  bind:
    create_host_path: false

services:
  pgdb:
    image: postgres:16-alpine
    container_name: postgres_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 4s
      timeout: 4s
      retries: 10
      start_period: 6s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  redis:
    image: redis:7-alpine
    container_name: redis_cache
    networks:
      - default
      - backend_net
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 4s
      timeout: 3s
      retries: 8
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  django:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        tableparser_package: ${TABLEPARSER_RELEASE_DIR:?Set the absolute release directory}/image
      target: django
    container_name: django
    command: >
      gunicorn eazyclass.wsgi:application
        --bind 0.0.0.0:8000
        --workers 3
        --log-level info
        --error-logfile -
    environment:
      <<: *tableparser-environment
      LOG_SERVICE: django
    env_file:
      - .env
    expose:
      - "8000"
    # Для django BASE DIR ==  /app/eazyclass
    volumes:
      - *tableparser-mount
      - static_data:/app/static
      - media_data:/app/media
    networks:
      - default
      - backend_net
    depends_on:
      pgdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"


  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        tableparser_package: ${TABLEPARSER_RELEASE_DIR:?Set the absolute release directory}/image
      target: backup-tools
    container_name: celery_worker
    command: >
      celery -A eazyclass worker
        --pool=prefork
        --concurrency=1
    volumes:
      - *tableparser-mount
      - ../../worker_data:/worker_input
      - ./rclone:/root/.config/rclone
    environment:
      <<: *tableparser-environment
      LOG_SERVICE: celery-worker
    env_file:
      - .env
    depends_on:
      pgdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "8m"
        max-file: "4"


  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        tableparser_package: ${TABLEPARSER_RELEASE_DIR:?Set the absolute release directory}/image
      target: backup-tools
    container_name: celery_beat
    command: >
      celery -A eazyclass beat
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *tableparser-environment
      LOG_SERVICE: celery-beat
    volumes:
      - *tableparser-mount
    env_file:
      - .env
    depends_on:
      pgdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "4"


  flower:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        tableparser_package: ${TABLEPARSER_RELEASE_DIR:?Set the absolute release directory}/image
      target: django
    container_name: celery_flower
    command: >
      celery -A eazyclass flower
        --address=0.0.0.0
        --port=5555
        --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
        --url_prefix=/flower
    environment:
      <<: *tableparser-environment
      LOG_SERVICE: flower
    volumes:
      - *tableparser-mount
    env_file:
      - .env
    expose:
      - "5555"
    depends_on:
      pgdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "4"


  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx конфиги
      - ./nginx/eazyclass.conf:/etc/nginx/conf.d/default.conf:ro

      # certbot (challenge + сертификаты)
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro

      # SPA
      - ../spa:/usr/share/nginx/html:ro

      # статика Django
      - static_data:/app/static:ro
      - media_data:/app/media:ro
    networks:
      - default
      - backend_net
    depends_on:
      - django
      - flower
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"


  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    depends_on:
      - nginx
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot


volumes:
  postgres_data:
  static_data:
  media_data:
  certbot_conf:
  certbot_www:

networks:
  backend_net:
    external: true
