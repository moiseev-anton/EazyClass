# Separate Compose project: start/stop without touching application containers.
name: eazyclass-observability

x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 60s

  alloy:
    image: grafana/alloy:v1.20.1
    # Docker socket and root-owned cron log require access on the host.
    # A read-only socket mount does NOT restrict Docker API operations.
    user: "0:0"
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      APP_COMPOSE_PROJECT: ${APP_COMPOSE_PROJECT:?Set APP_COMPOSE_PROJECT in observability/.env}
      OBS_COMPOSE_PROJECT: eazyclass-observability
      OBS_ENVIRONMENT: ${OBS_ENVIRONMENT:?Set OBS_ENVIRONMENT in observability/.env}
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount the directory so rotation does not leave Alloy reading an old inode.
      - type: bind
        source: ${CERTBOT_LOG_DIR:-./observability/host-logs}
        target: /var/log/host
        read_only: true
        bind:
          create_host_path: false
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    secrets:
      - grafana_admin_password
    depends_on:
      - loki
    restart: unless-stopped
    logging: *logging

secrets:
  grafana_admin_password:
    file: ./observability/grafana-admin.secret

volumes:
  loki_data:
  alloy_data:
  grafana_data:
