# Single-server storage. Only the private Compose network can reach this API.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 2
  delete_request_store: filesystem

limits_config:
  # Seven days; asynchronous deletion, not a disk quota.
  retention_period: 168h
  ingestion_rate_mb: 2
  ingestion_burst_size_mb: 4
  max_query_parallelism: 2
  split_queries_by_interval: 1h

querier:
  max_concurrent: 2

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32

ingester:
  # Loki accepts out-of-order entries up to half this age (six hours).
  # Match Alloy's 5h55m collection window; idle/full chunks still flush earlier.
  max_chunk_age: 12h
  wal:
    enabled: true
    dir: /loki/wal
    replay_memory_ceiling: 128MB

analytics:
  reporting_enabled: false
