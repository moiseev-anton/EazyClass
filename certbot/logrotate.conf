# Cron пишет сюда вывод certbot; Docker-ротация этот файл на хосте не ограничивает.
# install_renewal.sh устанавливает правило в /etc/logrotate.d/eazyclass-certbot.
/var/log/certbot-renew.log {
    # Еженедельная ротация, до восьми архивов.
    weekly
    rotate 8
    compress
    # Сжимаем со следующего цикла: текущий запуск ещё может писать в старый файл.
    delaycompress
    missingok
    notifempty
    # Новый файл доступен root. Cron открывает его заново при каждом запуске,
    # поэтому copytruncate и перезапуск процесса не нужны.
    create 0640 root root
}
